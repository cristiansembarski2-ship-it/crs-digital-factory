<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="description" content="Mini diagnóstico gratuito de maturidade operacional em Compras para incorporar em sites e treinamentos."><title>Mini Diagnóstico de Maturidade de Compras</title><script src="/shared/config.js" defer></script><script src="/shared/metrics.js" defer></script><style>:root{--bg:#07111f;--card:#0d1b2d;--line:#263b52;--ink:#f7f9fc;--muted:#9fb1c7;--green:#45e0c4;--cyan:#74ccff}*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.box{max-width:760px;margin:auto;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:18px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px}.head strong{font-size:20px}.head small{display:block;color:var(--muted);margin-top:4px}.free{color:var(--green);font-size:11px;font-weight:900;text-transform:uppercase}.q{padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}.q:first-child{border-top:0}.q label{display:block;font-size:13px;font-weight:850;margin-bottom:6px}.q select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#091827;color:var(--ink);font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 13px;border:1px solid var(--line);border-radius:11px;background:#10243a;color:var(--ink);font-weight:900;text-decoration:none;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,var(--cyan),var(--green));color:#06111e}.result{display:none;margin-top:14px;padding:15px;border:1px solid rgba(69,224,196,.3);border-radius:14px;background:rgba(69,224,196,.07)}.result.show{display:block}.score{font-size:48px;font-weight:950;color:var(--green);line-height:1}.level{font-size:18px;font-weight:900;margin:5px 0}.result p{margin:5px 0;color:#c8d7e6;line-height:1.45}.foot{display:flex;justify-content:space-between;gap:10px;margin-top:13px;color:var(--muted);font-size:11px}.foot a{color:var(--green);font-weight:800;text-decoration:none}@media(max-width:620px){.head,.foot{display:block}.free{margin-top:7px}.actions{display:grid}.btn{width:100%}}</style></head><body><main class="box"><div class="head"><div><strong>Diagnóstico de Maturidade de Compras</strong><small>Mini versão • 6 dimensões • autoavaliação</small></div><span class="free">Grátis</span></div><form id="miniForm"><div id="qs"></div><div class="actions"><button class="btn primary" type="submit">Calcular nota</button><button class="btn" type="button" id="example">Exemplo</button></div></form><section class="result" id="result"><div class="score" id="score">0/100</div><div class="level" id="level"></div><p id="explain"></p><div class="actions"><a class="btn primary" id="full" href="/diagnostico-maturidade-compras/?utm_source=widget-maturity&utm_medium=embed&utm_campaign=procurement-score" target="_blank" rel="noopener">Fazer diagnóstico completo</a><a class="btn" data-crs-checkout-link="mapa3CotacoesPro" data-crs-track-content="maturity-widget-mapa" href="https://pay.kiwify.com.br/cNesrrZ">Conhecer Mapa Pro</a></div></section><div class="foot"><span>Auto-diagnóstico educativo; não é benchmark de mercado.</span><a id="powered" href="/diagnostico-maturidade-compras/?utm_source=widget-maturity&utm_medium=embed&utm_campaign=procurement-score" target="_blank" rel="noopener">Powered by Compra Sem Achismo ↗</a></div></main><script>const dimensions=['Requisições chegam com escopo e quantidade padronizados?','As compras relevantes consultam alternativas comparáveis?','Preço, frete, desconto, prazo e condições são equalizados?','Custos além do preço são considerados antes da decisão?','A escolha do fornecedor fica documentada para aprovação?','Existe rastreabilidade de fornecedores, iniciativas e resultados?'];const root=document.getElementById('qs');root.innerHTML=dimensions.map((q,i)=>`<div class="q"><label for="q${i}">${i+1}. ${q}</label><select id="q${i}" required><option value="">Selecione</option><option value="0">0 — não existe</option><option value="1">1 — acontece às vezes</option><option value="2">2 — existe, mas é inconsistente</option><option value="3">3 — processo definido</option><option value="4">4 — definido, medido e revisado</option></select></div>`).join('');function band(s){if(s<40)return['Fundação','Priorize padronização e visibilidade do processo.'];if(s<60)return['Estrutura em evolução','Há práticas úteis, mas ainda falta consistência.'];if(s<80)return['Processo consistente','O próximo ganho tende a vir de integração e rastreabilidade.'];return['Alta disciplina operacional','Foque aderência, exceções e melhoria contínua.']}document.getElementById('miniForm').addEventListener('submit',e=>{e.preventDefault();const vals=dimensions.map((_,i)=>Number(document.getElementById('q'+i).value));if(vals.some(v=>!Number.isFinite(v)))return;const score=Math.round(vals.reduce((a,b)=>a+b,0)/24*100),b=band(score);document.getElementById('score').textContent=score+'/100';document.getElementById('level').textContent=b[0];document.getElementById('explain').textContent=b[1];document.getElementById('result').classList.add('show');try{if(typeof window.va==='function')window.va('event',{name:'Maturity Widget Completed',data:{band:Math.floor(score/20)*20}})}catch(_){}});document.getElementById('example').onclick=()=>{[2,2,1,1,2,1].forEach((v,i)=>document.getElementById('q'+i).value=v);document.getElementById('miniForm').requestSubmit()};</script></body></html>
