<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="Widget gratuito para comparar três fornecedores por valor, frete e desconto."><title>Comparador de Fornecedores | Compra Sem Achismo</title><style>:root{--bg:#07111f;--card:#0d1b2d;--line:#20334a;--ink:#f7f9fc;--muted:#9fb1c7;--green:#45e0c4;--cyan:#74ccff}*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.box{max-width:760px;margin:auto;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:15px}.head h1{font-size:21px;margin:0}.brand{font-size:12px;color:var(--muted);text-decoration:none}.brand b{color:var(--green)}.grid{display:grid;grid-template-columns:1fr repeat(3,minmax(100px,.75fr));gap:8px;align-items:end}.grid.header{color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.04em;margin-bottom:6px}.name{font-weight:800}.field{width:100%;padding:10px 9px;border:1px solid #284058;border-radius:10px;background:#091827;color:var(--ink);font-size:14px}.supplier{display:grid;grid-template-columns:1fr repeat(3,minmax(100px,.75fr));gap:8px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.06)}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:11px;min-height:42px;padding:10px 13px;background:rgba(255,255,255,.04);color:var(--ink);font-weight:850;cursor:pointer;text-decoration:none}.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--green));border:0;color:#06111e}.result{display:none;margin-top:14px;padding:14px;border-radius:13px;background:rgba(69,224,196,.08);border:1px solid rgba(69,224,196,.28)}.result.show{display:block}.result strong{color:var(--green)}.result p{margin:6px 0 0;color:#c8d7e6;line-height:1.45}.affiliate{display:none;margin-top:12px;padding:13px;border-radius:12px;border:1px solid rgba(116,204,255,.28);background:rgba(116,204,255,.06)}.affiliate.show{display:block}.affiliate small{display:block;color:var(--muted);margin-bottom:8px}.foot{display:flex;justify-content:space-between;gap:10px;margin-top:13px;color:var(--muted);font-size:11px}.foot a{color:var(--green)}@media(max-width:620px){.grid.header{display:none}.supplier{grid-template-columns:1fr 1fr}.supplier .name{grid-column:1/-1}.actions{display:grid}.btn{width:100%}.foot{display:block}.foot span{display:block;margin-top:5px}}</style></head><body><main class="box"><div class="head"><h1>Compare 3 fornecedores</h1><a class="brand" href="/desafio-3-cotacoes/" target="_blank" rel="noopener">Powered by <b>Compra Sem Achismo</b></a></div><div class="grid header"><div>Fornecedor</div><div>Itens (R$)</div><div>Frete (R$)</div><div>Desconto (R$)</div></div><div id="rows"></div><div class="actions"><button class="btn primary" id="calc">Comparar agora</button><button class="btn" id="example">Exemplo</button><button class="btn" id="full">Abrir desafio completo</button></div><section class="result" id="result"><strong id="winner"></strong><p id="detail"></p><div class="affiliate" id="affiliateBox"><small>Para compras recorrentes, existe uma versão Pro em Excel.</small><a class="btn primary" id="affiliateCta" target="_blank" rel="noopener noreferrer sponsored">Conhecer Mapa 3 Cotações Pro</a></div></section><div class="foot"><span>Cálculo: itens + frete − desconto.</span><a href="/incorporar-comparador/" target="_blank" rel="noopener">Adicionar este comparador ao seu site →</a></div></main><script>const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),letters=['A','B','C'],root=document.getElementById('rows');root.innerHTML=letters.map((l,i)=>`<div class="supplier"><div class="name">Fornecedor ${l}</div><input class="field" id="p${i}" type="number" min="0" step=".01" placeholder="Itens"><input class="field" id="f${i}" type="number" min="0" step=".01" placeholder="Frete"><input class="field" id="d${i}" type="number" min="0" step=".01" placeholder="Desconto"></div>`).join('');function n(id){return Math.max(0,Number(document.getElementById(id).value)||0)}function data(){return letters.map((l,i)=>({l,price:n('p'+i),freight:n('f'+i),discount:n('d'+i),total:Math.max(0,n('p'+i)+n('f'+i)-n('d'+i))}))}function decodeAff(){if(!location.hash.startsWith('#aff='))return null;try{let s=location.hash.slice(5).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const url=decodeURIComponent(escape(atob(s))),u=new URL(url);if(u.protocol!=='https:'||!(u.hostname==='pay.kiwify.com.br'||u.hostname.endsWith('.kiwify.com.br')))return null;return u.toString()}catch(e){return null}}const affiliateUrl=decodeAff();if(affiliateUrl){document.getElementById('affiliateCta').href=affiliateUrl;document.getElementById('affiliateBox').classList.add('show')}function calc(){const a=data();if(a.some(x=>!x.price)){document.getElementById('result').classList.add('show');document.getElementById('winner').textContent='Preencha o valor dos itens dos 3 fornecedores.';document.getElementById('detail').textContent='Frete e desconto podem ficar zerados.';return}const by=[...a].sort((x,y)=>x.total-y.total),w=by[0],low=[...a].sort((x,y)=>x.price-y.price)[0],surprise=w.l!==low.l;document.getElementById('result').classList.add('show');document.getElementById('winner').textContent=surprise?`Reviravolta: Fornecedor ${low.l} tinha o menor preço, mas o ${w.l} venceu.`:`Fornecedor ${w.l} tem o menor custo informado.`;document.getElementById('detail').textContent=`Custo comparável: ${BRL.format(w.total)}. Faça o desafio completo para compartilhar a comparação.`}document.getElementById('calc').onclick=calc;document.getElementById('example').onclick=()=>{[[8900,1100,0],[9400,0,0],[9650,0,150]].forEach((x,i)=>{document.getElementById('p'+i).value=x[0];document.getElementById('f'+i).value=x[1]||'';document.getElementById('d'+i).value=x[2]||''});calc()};document.getElementById('full').onclick=()=>{const a=data(),u=new URL('/desafio-3-cotacoes/',location.origin);a.forEach((x,i)=>{if(x.price)u.searchParams.set('p'+i,x.price);if(x.freight)u.searchParams.set('f'+i,x.freight);if(x.discount)u.searchParams.set('d'+i,x.discount)});u.searchParams.set('utm_source','embedded-widget');u.searchParams.set('utm_medium','referral');u.searchParams.set('utm_campaign','widget-comparador');window.open(u.toString(),'_blank','noopener')};</script></body></html>
