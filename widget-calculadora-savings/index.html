<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="Widget gratuito para calcular savings em compras a partir de baseline, preço negociado e quantidade."><link rel="canonical" href="https://crs-digital-factory.vercel.app/widget-calculadora-savings/"><title>Calculadora de Savings | Compra Sem Achismo</title><style>:root{--bg:#07111f;--card:#0d1b2d;--line:#263b52;--ink:#f7f9fc;--muted:#9fb1c7;--cyan:#74ccff;--green:#45e0c4}*{box-sizing:border-box}body{margin:0;padding:14px;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.box{max-width:760px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.free{font-size:11px;color:var(--green);font-weight:900;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);border-radius:11px;background:#091827;color:var(--ink);padding:12px;font:inherit}.actions{display:flex;gap:10px;margin-top:13px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--cyan),var(--green));color:#06111e}.ghost{background:#10243a;color:var(--ink);border:1px solid var(--line)}.result{display:none;margin-top:16px;padding:16px;border-radius:14px;border:1px solid rgba(69,224,196,.35);background:rgba(69,224,196,.07)}.result.show{display:block}.result span{display:block;color:var(--muted);font-size:12px}.result strong{display:block;font-size:30px;margin:4px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.stat{padding:10px;border:1px solid var(--line);border-radius:11px;background:#091827}.stat b{display:block;margin-top:3px}.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:15px;color:var(--muted);font-size:11px}.foot a{color:var(--green);font-weight:800;text-decoration:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.top,.foot{display:block}.free{margin-top:8px}.actions{display:grid}.btn{width:100%}}</style></head><body><main class="box"><div class="top"><div class="brand">✓ Compra Sem Achismo<small>Calculadora gratuita de Savings em Compras</small></div><span class="free">Sem cadastro</span></div><form id="f"><div class="grid"><div class="field"><label for="b">Preço de referência</label><input id="b" type="number" min="0" step="0.01" placeholder="50,00" required></div><div class="field"><label for="n">Preço negociado</label><input id="n" type="number" min="0" step="0.01" placeholder="46,00" required></div><div class="field"><label for="q">Quantidade</label><input id="q" type="number" min="0" step="0.01" placeholder="1200" required></div></div><div class="actions"><button class="btn" type="submit">Calcular saving</button><button class="btn ghost" type="button" id="ex">Usar exemplo</button></div></form><section class="result" id="r"><span>Saving estimado</span><strong id="saving">R$ 0,00</strong><div class="stats"><div class="stat"><span>Variação percentual</span><b id="pct">0%</b></div><div class="stat"><span>Total negociado</span><b id="total">R$ 0,00</b></div></div></section><div class="foot"><span>Estimativa gerencial. O reconhecimento depende das regras da organização.</span><a href="https://crs-digital-factory.vercel.app/savings-compras/?utm_source=widget-savings&utm_medium=embed&utm_campaign=savings" target="_blank" rel="noopener">Powered by Compra Sem Achismo ↗</a></div></main><script>const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});const val=id=>Math.max(0,Number(document.getElementById(id).value)||0);function calc(){const b=val('b'),n=val('n'),q=val('q');if(!b||!q)return;const s=(b-n)*q;document.getElementById('saving').textContent=brl.format(s);document.getElementById('pct').textContent=((b-n)/b*100).toLocaleString('pt-BR',{maximumFractionDigits:2})+'%';document.getElementById('total').textContent=brl.format(n*q);document.getElementById('r').classList.add('show')}document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();calc()});document.getElementById('ex').addEventListener('click',()=>{document.getElementById('b').value=50;document.getElementById('n').value=46;document.getElementById('q').value=1200;calc()});</script></body></html>
